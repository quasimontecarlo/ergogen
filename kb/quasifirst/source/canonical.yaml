meta:
    engine: 4.1.0
    author: quasimontecarlo
units:
    center_shift_x: 170
    center_shift_y: -165
points:
    zones:
        matrix:
            anchor:
                shift:
                    - center_shift_x
                    - center_shift_y
            columns:
                pinky:
                    key:
                        splay: 0.25cx
                    rows:
                        home:
                            column_net: 2
                ring:
                    key:
                        stagger: 0.85cx
                        spread: 1.1cx
                        splay: '-0.15cx'
                middle:
                    key:
                        stagger: 0.25cx
                        splay: '-0.15cx'
                        spread: 1.085cx
                index:
                    key:
                        stagger: '-0.25cx'
                inner:
                    key:
                        stagger: '-0.2cx'
            rows:
                bottom:
                    padding: cx
                home:
                    padding: cx
                top:
                    padding: cx
        thumb:
            anchor:
                ref: matrix_index_bottom
                shift:
                    - 0
                    - '-1.65cx'
            columns:
                innit:
                    key:
                        name: thumb_innit
                middle:
                    key:
                        name: thumb_middle
                reachy:
                    key:
                        spread: cx
                        splay: -15
                        origin:
                            - 0.35cx
                            - '-0.75cx'
                        name: thumb_reachy
outlines:
    raw:
        -
            what: rectangle
            where: true
            size:
                - cx
                - cy
    board:
        -
            what: polygon
            points:
                -
                    ref: thumb_reachy
                    shift:
                        - 0.49cx
                        - 0.749cy
                -
                    ref: thumb_reachy
                    shift:
                        - 0.49cx
                        - '-0.749cy'
                -
                    ref: thumb_middle
                    shift:
                        - 0.49cx
                        - '-0.49cy'
                -
                    ref: thumb_innit
                    shift:
                        - 0.49cx
                        - '-0.49cy'
                -
                    ref: thumb_innit
                    shift:
                        - '-0.49cx'
                        - '-0.49cy'
                -
                    ref: matrix_index_bottom
                    shift:
                        - '-0.49cx'
                        - '-0.221cy'
                -
                    ref: matrix_ring_bottom
                    shift:
                        - +0.49cx
                        - '-0.195cy'
                -
                    ref: matrix_ring_bottom
                    shift:
                        - +0.49cx
                        - '-0.49cy'
                -
                    ref: matrix_ring_bottom
                    shift:
                        - '-0.59cx'
                        - '-0.49cy'
                -
                    ref: matrix_pinky_bottom
                    shift:
                        - +0.49cx
                        - '-0.49cy'
                -
                    ref: matrix_pinky_bottom
                    shift:
                        - '-0.49cx'
                        - '-0.49cy'
                -
                    ref: matrix_pinky_top
                    shift:
                        - '-0.49cx'
                        - 0.49cy
                -
                    ref: matrix_pinky_top
                    shift:
                        - 0.685cx
                        - 0.49cy
                -
                    ref: matrix_ring_top
                    shift:
                        - '-0.49cx'
                        - 0.49cy
                -
                    ref: matrix_ring_top
                    shift:
                        - 0.7cx
                        - 0.49cy
                -
                    ref: matrix_middle_top
                    shift:
                        - '-0.49cx'
                        - 0.49cy
                -
                    ref: matrix_middle_top
                    shift:
                        - 0.49cx
                        - 0.49cy
                -
                    ref: matrix_index_top
                    shift:
                        - '-0.565cx'
                        - 0.49cy
                -
                    ref: matrix_index_top
                    shift:
                        - 0.49cx
                        - 0.49cy
                -
                    ref: matrix_index_top
                    shift:
                        - 0.49cx
                        - 0.49cy
                -
                    ref: matrix_inner_top
                    shift:
                        - '-0.565cx'
                        - 0.49cy
                -
                    ref: matrix_inner_top
                    shift:
                        - 0.49cx
                        - 0.49cy
                -
                    ref: matrix_inner_home
                    shift:
                        - 0.49cx
                        - 1.4cy
                -
                    ref: matrix_inner_home
                    shift:
                        - 1.85cx
                        - 1.4cy
            fillet: 0
    keycaps:
        -
            what: rectangle
            where: true
            size:
                - 1cx - 0.5
                - 1cy - 0.5
            operation: stack
    keycaps15:
        -
            what: rectangle
            where: thumb_reachy
            size:
                - 1cx - 0.5
                - 1.5cy - 0.5
            operation: stack
    plate:
        - board
        - '-keycaps'
        - '-keycaps15'
pcbs:
    quasikeyboard:
        template: kicad8
        outlines:
            board:
                outline: board
            keycaps:
                outline: keycaps
                layer: Eco1.User
        footprints:
            choc_hotswap:
                what: choc
                where: true
                params:
                    from: '{{name}}'
                    to: GND
                    keycaps: true
                    reverse: true
                    hotswap: true
            mcu:
                what: mcu_nice_nano
                where:
                    -
                        ref: matrix_inner_home
                        shift:
                            - 10cx
                            - 5cx
                params:
                    reversible: true
                    only_required_jumpers: true
                    P7: matrix_pinky_top
                    P7_label: P7
                    P18: matrix_ring_top
                    P18_label: P18
                    P19: matrix_middle_top
                    P19_label: P19
                    P20: matrix_index_top
                    P20_label: P20
                    P21: matrix_inner_top
                    P21_label: P21
                    P15: matrix_pinky_home
                    P15_label: P15
                    P14: matrix_ring_home
                    P14_label: P14
                    P16: matrix_middle_home
                    P16_label: P16
                    P10: matrix_index_home
                    P10_label: P10
                    P1: matrix_inner_home
                    P1_label: P1
                    P2: matrix_pinky_bottom
                    P2_label: P2
                    P3: matrix_ring_bottom
                    P3_label: P3
                    P4: matrix_middle_bottom
                    P4_label: P4
                    P5: matrix_index_bottom
                    P5_label: P5
                    P6: matrix_inner_bottom
                    P6_label: P6
                    P0: thumb_innit
                    P0_label: P11
                    P8: thumb_middle
                    P8_label: P8
                    P9: thumb_reachy
                    P9_label: P9
            reset:
                what: reset_switch_tht_top
                where:
                    ref: matrix_inner_bottom
                    shift:
                        - 30
                        - 0
                params:
                    reversible: true
                    from: GND
                    to: RST
            power:
                what: power_switch_smd_side
                where:
                    ref: matrix_inner_bottom
                    shift:
                        - 40
                        - 0
                params:
                    reversible: true
                    from: BAT_P
                    to: RAW
